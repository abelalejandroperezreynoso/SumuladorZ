# Publicación en Netlify: cada cambio en main compila y publica el juego.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Los archivos de assets/ llevan un hash en el nombre y nunca cambian: el navegador los guarda
# un año y no vuelve a descargarlos (importa con datos móviles).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Estos deben pedirse siempre al servidor para que llegue cada versión nueva.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

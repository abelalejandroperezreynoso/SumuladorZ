<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SumuladorZ" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>SumuladorZ — Mundo de pruebas</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #0b0f14; font-family: system-ui, sans-serif; color: #e8eef5; }
      canvas { display: block; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
      #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%, 0 65%, 100% 65%, 100% 100%, 0 100%); }
      #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; clip-path: polygon(0 0, 35% 0, 35% 100%, 0 100%, 0 0, 65% 0, 100% 0, 100% 100%, 65% 100%, 65% 0); }
      .panel { position: fixed; background: rgba(10, 14, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.6; pointer-events: none; }
      #controls { left: 12px; bottom: 12px; }
      #stats { right: 12px; top: 12px; text-align: right; font-variant-numeric: tabular-nums; }
      kbd { background: rgba(255, 255, 255, 0.14); border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 12px; }
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(5, 8, 12, 0.72); cursor: pointer; text-align: center; }
      #overlay h1 { margin: 0; font-size: 40px; letter-spacing: 2px; }
      #overlay p { margin: 0; opacity: 0.8; }
      #overlay.hidden { display: none; }
      #rotate { display: none; }
      /* --- Controles táctiles --- */
      #touch-ui { display: none; }
      body.touch #touch-ui { display: block; }
      body.touch #controls { display: none; }
      body.touch #stats { font-size: 11px; padding: 6px 10px; top: max(8px, env(safe-area-inset-top)); right: max(64px, env(safe-area-inset-right)); }
      #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.08); left: calc(90px + env(safe-area-inset-left)); top: calc(100% - 100px); opacity: 0.45; pointer-events: none; }
      #stick.active { opacity: 1; }
      #stick-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
      #touch-ui button { position: fixed; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(20, 26, 34, 0.45); color: #fff; font: 600 13px system-ui, sans-serif; padding: 0; touch-action: none; }
      #touch-ui button:active, #touch-ui button.held { background: rgba(255, 255, 255, 0.35); }
      #t-fire { width: 92px; height: 92px; right: calc(28px + env(safe-area-inset-right)); bottom: 70px; }
      #t-punch { width: 68px; height: 68px; right: calc(136px + env(safe-area-inset-right)); bottom: 36px; }
      #t-cover { width: 68px; height: 68px; right: calc(136px + env(safe-area-inset-right)); bottom: 120px; }
      #t-jump { width: 68px; height: 68px; right: calc(40px + env(safe-area-inset-right)); bottom: 178px; }
      #t-reset { width: 40px; height: 40px; right: calc(12px + env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); font-size: 20px !important; }
      @media (orientation: portrait) {
        body.touch #rotate { display: block; position: fixed; left: 0; right: 0; top: 18%; text-align: center; font-size: 14px; opacity: 0.85; pointer-events: none; text-shadow: 0 1px 3px #000; }
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="controls" class="panel">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> caminar &nbsp;·&nbsp; <kbd>Shift</kbd> correr &nbsp;·&nbsp; <kbd>Espacio</kbd> saltar<br />
      <kbd>Clic izq.</kbd> disparar &nbsp;·&nbsp; <kbd>Clic der.</kbd> / <kbd>F</kbd> golpear &nbsp;·&nbsp; <kbd>C</kbd> cubrirse<br />
      <kbd>Ratón</kbd> cámara &nbsp;·&nbsp; <kbd>Rueda</kbd> zoom &nbsp;·&nbsp; <kbd>R</kbd> reiniciar mundo
    </div>
    <div id="stats" class="panel"></div>
    <div id="rotate">Gira el teléfono en horizontal para jugar mejor</div>
    <div id="overlay">
      <h1>SumuladorZ</h1>
      <p id="overlay-msg">Cargando…</p>
    </div>
    <script>
      // Diagnóstico de arranque: cualquier error se muestra en pantalla (útil en móviles sin consola).
      (function () {
        var msg = document.getElementById('overlay-msg');
        window.__bootStatus = function (text) { if (!window.__bootFailed) msg.textContent = text; };
        window.__bootError = function (text) {
          window.__bootFailed = true;
          msg.textContent = 'Error: ' + text;
          msg.style.cssText = 'color:#ffb4a8;max-width:90%;font-size:13px;word-break:break-word;user-select:text;-webkit-user-select:text';
        };
        addEventListener('error', function (e) {
          if (e.target && e.target.tagName === 'SCRIPT') __bootError('no se pudo descargar ' + e.target.src);
          else if (!window.__game) __bootError((e.message || 'desconocido') + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')');
        }, true);
        addEventListener('unhandledrejection', function (e) {
          if (!window.__game) __bootError(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
        });
        setTimeout(function () {
          if (!window.__game && !window.__bootFailed) msg.textContent += ' (está tardando; la primera descarga pesa unos 2 MB)';
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
